[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "apex-tick"
version = "0.1.0"
description = "Bounded FPGA trading-core research with independent simulation verification"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Ahmed Hassan"}]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
apex-tick = "apex_tick.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
